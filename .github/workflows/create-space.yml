name: Create Space

on:
  push:
    branches: [main]
    paths: ['kin-spaces/create_space.py']
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  create-space:
    if: github.event_name != 'pull_request_target' || contains(github.event.pull_request.head.ref, 'create-space')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install "huggingface_hub>=0.26,<0.30"
      - name: Syntax check
        run: python -m py_compile kin-spaces/create_space.py
      - name: Create Space
        run: python kin-spaces/create_space.py 2>&1 | tee kin-spaces/OUTPUT.txt
      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add kin-spaces/OUTPUT.txt || true
          git commit -m "chore: capture Space creation output [skip ci]" || true
          git push || true
