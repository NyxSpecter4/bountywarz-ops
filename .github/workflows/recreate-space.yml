name: Recreate Space Public

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  recreate-space:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install huggingface_hub
      - name: Recreate Space
        run: python kin-spaces/recreate_space.py
