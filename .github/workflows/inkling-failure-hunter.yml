name: inkling-failure-hunter
on:
  push:
    branches:
      - "inkling-hunt*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-cache-dir openai
      - run: python kin-inkling/failure_hunter.py
        env:
          TINKER_API_KEY: tml-JyTGXaKG7cCYkXS4EuUZZzeM36a46pZGrfSWoj3ENJYeZAoPFmMo5CsaOUvKwuXxDAAAA
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inkling_results/
          git commit -m "inkling failure hunt results" || echo "no changes to commit"
          git push
