name: Fix Space Visibility

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  fix-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install huggingface_hub requests
      - name: Fix visibility
        run: python kin-spaces/fix_visibility.py
