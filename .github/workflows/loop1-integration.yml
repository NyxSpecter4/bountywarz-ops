name: Loop 1 - Challenge Pack to Cockpit to Arena

on:
  push:
    branches: [main]
    paths: ['kin-deploy/challenge-packs/**']

jobs:
  integrate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: node-version: '20'
      - name: Find latest challenge pack
        id: find-pack
        run: |
          PACKS=$(find kin-deploy/challenge-packs -type d -mindepth 1 -maxdepth 1 | sort)
          if [ -z "$PACKS" ]; then echo "No packs found"; exit 0; fi
          LATEST=$(echo "$PACKS" | tail -1)
          NAME=$(basename "$LATEST")
          echo "pack=$NAME" >> $GITHUB_OUTPUT
          echo "pack_path=$LATEST" >> $GITHUB_OUTPUT
      - name: Count existing sports
        id: sport-num
        run: |
          COUNT=$(grep -c "Sport #" arena/kinetigor-cockpit.js || echo 0)
          NEXT=$((COUNT + 1))
          echo "sport=$NEXT" >> $GITHUB_OUTPUT
      - name: RUN COCKPIT
        run: |
          echo "Running Cockpit for Sport #${{ steps.sport-num.outputs.sport }}"
          node arena/kinetigor-cockpit.js --sport=${{ steps.sport-num.outputs.sport }}
      - name: Save Arena Results
        run: |
          PACK="${{ steps.find-pack.outputs.pack }}"
          SPORT="${{ steps.sport-num.outputs.sport }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          DIR="arena-results/$TIMESTAMP/$PACK"
          mkdir -p "$DIR"
          echo '{"pack":"$PACK","sport":$SPORT,"timestamp":"$(date -Iseconds)"}' > "$DIR/metadata.json"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add . && git commit -m "Loop 1: $PACK (Sport #$SPORT)" || true
          git push || true
