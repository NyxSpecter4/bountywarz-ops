name: Loop 1 - Challenge Pack to Cockpit to Arena

on:
  push:
    branches: [main]
    paths:
      - 'kin-deploy/challenge-packs/**'

jobs:
  integrate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Find latest challenge pack
        id: find-pack
        run: |
          LATEST=$(find kin-deploy/challenge-packs -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort | tail -1)
          if [ -z "$LATEST" ]; then
            echo "No challenge packs found"
            exit 1
          fi
          echo "pack=$LATEST" >> $GITHUB_OUTPUT
          echo "Found pack: $LATEST"
      
      - name: Get next Sport number
        id: sport-num
        run: |
          COUNT=$(grep -c "Sport #" arena/kinetigor-cockpit.js || echo 0)
          NEXT=$((COUNT + 1))
          echo "sport=$NEXT" >> $GITHUB_OUTPUT
      
      - name: Log integration
        run: |
          echo "Loop 1: Integrating ${{ steps.find-pack.outputs.pack }} as Sport #${{ steps.sport-num.outputs.sport }}"
      
      - name: Run Cockpit
        run: |
          node arena/kinetigor-cockpit.js --sport=${{ steps.sport-num.outputs.sport }}
      
      - name: Save metadata
        run: |
          DIR="arena-results/$(date +%Y%m%d-%H%M%S)/${{ steps.find-pack.outputs.pack }}"
          mkdir -p "$DIR"
          echo '{"pack":"${{ steps.find-pack.outputs.pack }}","sport":${{ steps.sport-num.outputs.sport }},"status":"completed","timestamp":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}' > "$DIR/metadata.json"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add arena-results/ && git commit -m "Loop 1: ${{ steps.find-pack.outputs.pack }} as Sport #${{ steps.sport-num.outputs.sport }}" || true
          git push || true