name: New Space + Card Update

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  new-space:
    if: contains(github.event.pull_request.head.ref, 'new-space')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install huggingface_hub
      - name: Create Space + Update Card
        run: python kin-spaces/new_space.py
