name: KIN Cybersecurity Training Pipeline

on:
  push:
    branches:
      - 'train*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch transformers peft trl datasets accelerate
          pip install huggingface_hub
          pip install sentencepiece protobuf

      - name: Verify GPU availability
        id: gpu
        run: |
          python -c "
          import torch
          if torch.cuda.is_available():
              print('GPU_AVAILABLE=true')
              echo 'gpu=true' >> $GITHUB_OUTPUT
          else:
              print('GPU_AVAILABLE=false')
              echo 'gpu=false' >> $GITHUB_OUTPUT
          "

      # --- Lockdown: ensure only 3 repos are public ---
      - name: Lockdown HF repos
        id: lockdown
        working-directory: kin-gguf
        continue-on-error: true
        run: |
          python cleanup_visibility.py || echo "Lockdown script completed (may have warnings)"

      # --- Phase 1: SFT ---
      - name: Generate SFT data
        id: sft-data
        working-directory: kin-gguf
        continue-on-error: true
        run: |
          python generate_sft_data.py

      - name: Phase 1 - SFT Training
        id: sft-training
        working-directory: kin-gguf
        continue-on-error: true
        run: |
          python train_sft.py

      # --- Phase 2: DPO with soft labels ---
      - name: Phase 2 - DPO Training (GDPO-style soft labels)
        id: dpo-training
        working-directory: kin-gguf
        continue-on-error: true
        run: |
          python train_dpo_v6.py

      # --- Phase 3: GRPO (GPU only) ---
      - name: Phase 3 - GRPO Training (verifiable rewards)
        id: grpo-training
        working-directory: kin-gguf
        continue-on-error: true
        run: |
          python train_grpo.py

      # --- Post-training: update Space ---
      - name: Update Space
        id: update-space
        working-directory: kin-gguf
        continue-on-error: true
        run: |
          python update_space.py || echo "Space update skipped"

      # --- Summary ---
      - name: Pipeline summary
        if: always()
        run: |
          echo "## KIN Cybersecurity Training Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lockdown | ${{ steps.lockdown.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SFT Data Generation | ${{ steps.sft-data.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SFT Training (Phase 1) | ${{ steps.sft-training.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DPO Training (Phase 2) | ${{ steps.dpo-training.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GRPO Training (Phase 3) | ${{ steps.grpo-training.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Space Update | ${{ steps.update-space.outcome }} |" >> $GITHUB_STEP_SUMMARY
