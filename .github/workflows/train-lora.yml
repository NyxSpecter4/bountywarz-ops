name: train-lora
on:
  pull_request_target:
    branches: [main]
  push:
    branches:
      - "**train**"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.head.ref, 'train')) ||
      (github.event_name == 'push' && contains(github.ref_name, 'train'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install ML deps
        run: pip install --no-cache-dir transformers peft trl datasets huggingface_hub accelerate
      - name: Train LoRA adapter (GPU-adaptive)
        run: python kin-gguf/train_lora.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || "" }}