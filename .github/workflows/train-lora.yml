name: train-lora
on:
  push:
    branches:
      - "train*"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-cache-dir transformers peft trl datasets huggingface_hub accelerate
      - run: python -c "import py_compile; py_compile.compile('kin-gguf/train_v5_final.py', doraise=True)"
      - run: python kin-gguf/train_v5_final.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || '' }}