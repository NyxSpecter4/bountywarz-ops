name: train-lora
on:
  push:
    branches:
      - "train*"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fixes to train_v5.py
        run: |
          python kin-gguf/fix_v5.py > /tmp/fix_output.txt 2>&1
          FIX_STATUS=$?
          cat /tmp/fix_output.txt
          if [ $FIX_STATUS -ne 0 ]; then
            gh pr comment 36 --body "FIX SCRIPT FAILED: $(cat /tmp/fix_output.txt)" || true
            exit 1
          fi
          python -m py_compile kin-gguf/train_v5.py > /tmp/compile_output.txt 2>&1
          COMPILE_STATUS=$?
          cat /tmp/compile_output.txt
          if [ $COMPILE_STATUS -ne 0 ]; then
            gh pr comment 36 --body "PY_COMPILE FAILED: $(cat /tmp/compile_output.txt)" || true
            exit 1
          fi
          echo "Fix and compile OK"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-cache-dir transformers peft trl datasets huggingface_hub accelerate
      - name: Run v5 training
        run: |
          python kin-gguf/train_v5.py > /tmp/train_output.txt 2>&1
          TRAIN_STATUS=$?
          cat /tmp/train_output.txt
          if [ $TRAIN_STATUS -ne 0 ]; then
            gh pr comment 36 --body "TRAINING FAILED (last 50 lines): $(tail -50 /tmp/train_output.txt)" || true
            exit 1
          fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || '' }}
          GH_TOKEN: ${{ github.token }}
