name: KIN Cybersecurity Training Pipeline

on:
  push:
    branches:
      - 'train*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch transformers peft trl datasets accelerate
          pip install huggingface_hub
          pip install sentencepiece protobuf

      - name: Verify GPU availability
        id: gpu
        run: |
          python -c "
          import torch
          if torch.cuda.is_available():
              print('GPU_AVAILABLE=true')
              print('::set-output name=gpu::true')
          else:
              print('GPU_AVAILABLE=false')
              print('::set-output name=gpu::false')
          "

      # --- Lockdown: ensure only 3 repos are public ---
      - name: Lockdown HF repos
        working-directory: kin-gguf
        run: |
          python cleanup_visibility.py || echo "Lockdown script completed (may have warnings)"

      # --- Phase 1: SFT ---
      - name: Generate SFT data
        working-directory: kin-gguf
        run: |
          python generate_sft_data.py

      - name: Phase 1 - SFT Training
        working-directory: kin-gguf
        run: |
          python train_sft.py
        continue-on-error: true

      # --- Phase 2: DPO with soft labels ---
      - name: Phase 2 - DPO Training (GDPO-style soft labels)
        working-directory: kin-gguf
        run: |
          python train_dpo_v6.py
        continue-on-error: true

      # --- Phase 3: GRPO (GPU only) ---
      - name: Phase 3 - GRPO Training (verifiable rewards)
        working-directory: kin-gguf
        run: |
          python train_grpo.py
        continue-on-error: true

      # --- Post-training: update Space ---
      - name: Update Space
        working-directory: kin-gguf
        run: |
          python update_space.py || echo "Space update skipped"

      # --- Summary ---
      - name: Pipeline summary
        if: always()
        run: |
          echo "## KIN Cybersecurity Training Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SFT (Phase 1) | ${{ job.steps.phase-1--sft-training.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DPO (Phase 2) | ${{ job.steps.phase-2--dpo-training-gdpo-style-soft-labels.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GRPO (Phase 3) | ${{ job.steps.phase-3--grpo-training-verifiable-rewards.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Space Update | ${{ job.steps.update-space.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lockdown | ${{ job.steps.lockdown-hf-repos.outcome }} |" >> $GITHUB_STEP_SUMMARY
