name: KIN Cybersecurity LoRA Training Pipeline

on:
  push:
    branches: [train-v5-lora]
    paths:
      - 'kin-gguf/train_sft.py'
      - 'kin-gguf/train_dpo_v6.py'
      - 'kin-gguf/train_grpo.py'
      - 'kin-gguf/generate_sft_data.py'
      - '.github/workflows/train-lora.yml'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch transformers trl peft datasets huggingface_hub accelerate

      - name: Verify GPU
        id: gpu
        run: |
          python -c "import torch; print(f'GPU available: {torch.cuda.is_available()}')"
          if python -c "import torch; assert torch.cuda.is_available()" 2>/dev/null; then
            echo "has_gpu=true" >> $GITHUB_OUTPUT
          else
            echo "has_gpu=false" >> $GITHUB_OUTPUT
          fi

      # Phase 1a: Generate SFT data
      - name: Phase 1a - Generate SFT Data
        continue-on-error: true
        working-directory: kin-gguf
        run: python generate_sft_data.py

      # Phase 1b: SFT Training
      - name: Phase 1b - SFT Training
        continue-on-error: true
        working-directory: kin-gguf
        run: python train_sft.py

      # Phase 2: DPO with GDPO soft labels
      - name: Phase 2 - DPO Training
        continue-on-error: true
        working-directory: kin-gguf
        run: python train_dpo_v6.py

      # Phase 3: GRPO with verifiable rewards
      - name: Phase 3 - GRPO Training
        continue-on-error: true
        working-directory: kin-gguf
        run: python train_grpo.py

      # Upload error files as artifacts for diagnostics
      - name: Upload error files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-errors
          path: |
            kin-gguf/sft_error.txt
            kin-gguf/dpo_error.txt
            kin-gguf/grpo_error.txt
          if-no-files-found: ignore

      # Upload training outputs
      - name: Upload training outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: |
            kin-gguf/sft_output/
            kin-gguf/dpo_v6_output/
            kin-gguf/grpo_output/
          if-no-files-found: ignore

      - name: Pipeline Summary
        if: always()
        run: |
          echo "=== KIN Cybersecurity Training Pipeline Summary ==="
          echo "GPU available: ${{ steps.gpu.outputs.has_gpu }}"
          echo ""
          echo "--- Error files ---"
          for f in sft_error.txt dpo_error.txt grpo_error.txt; do
            if [ -f "kin-gguf/$f" ]; then
              echo "[$f] FAILED:"
              cat "kin-gguf/$f"
              echo ""
            else
              echo "[$f] No error file (may have succeeded or not reached this phase)"
            fi
          done
          echo ""
          echo "--- SFT output ---"
          ls -la kin-gguf/sft_output/ 2>/dev/null || echo "No SFT output"
          echo ""
          echo "--- DPO output ---"
          ls -la kin-gguf/dpo_v6_output/ 2>/dev/null || echo "No DPO output"
          echo ""
          echo "--- GRPO output ---"
          ls -la kin-gguf/grpo_output/ 2>/dev/null || echo "No GRPO output"

      - name: Post error diagnostics to PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Training Pipeline Diagnostics (Run ${{ github.run_id }})" > /tmp/pr_body.md
          echo "GPU: ${{ steps.gpu.outputs.has_gpu }}" >> /tmp/pr_body.md
          for f in sft_error.txt dpo_error.txt grpo_error.txt; do
            if [ -f "kin-gguf/$f" ]; then
              echo "" >> /tmp/pr_body.md
              echo "### $f" >> /tmp/pr_body.md
              echo '```' >> /tmp/pr_body.md
              cat "kin-gguf/$f" >> /tmp/pr_body.md
              echo '```' >> /tmp/pr_body.md
            fi
          done
          if [ ! -f "kin-gguf/sft_error.txt" ]; then
            echo "" >> /tmp/pr_body.md
            echo "### SFT: No error file (succeeded or not reached)" >> /tmp/pr_body.md
          fi
          if [ ! -f "kin-gguf/dpo_error.txt" ]; then
            echo "" >> /tmp/pr_body.md
            echo "### DPO: No error file (succeeded or not reached)" >> /tmp/pr_body.md
          fi
          if [ ! -f "kin-gguf/grpo_error.txt" ]; then
            echo "" >> /tmp/pr_body.md
            echo "### GRPO: No error file (succeeded or not reached)" >> /tmp/pr_body.md
          fi
          gh pr comment 36 --body-file /tmp/pr_body.md || echo "Could not post PR comment"
