name: train-lora
on:
  push:
    branches:
      - "train*"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test fix script
        run: |
          echo "=== Running fix_v5.py ==="
          python kin-gguf/fix_v5.py
          echo "=== Fix exit: $? ==="
          echo "=== Running py_compile ==="
          python -m py_compile kin-gguf/train_v5.py
          echo "=== Compile exit: $? ==="
          echo "=== SUCCESS: fix and compile passed ==="
