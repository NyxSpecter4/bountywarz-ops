name: train-lora
on:
  push:
    branches:
      - "train*"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fixes to train_v5.py
        run: |
          python kin-gguf/fix_v5.py 2>&1 | tee /tmp/fix_output.txt
          echo "--- py_compile check ---"
          python -m py_compile kin-gguf/train_v5.py 2>&1 | tee /tmp/compile_output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "COMPILE_FAILED"
            cat /tmp/fix_output.txt /tmp/compile_output.txt > /tmp/error_log.txt
            gh pr comment 36 --body "$(cat /tmp/error_log.txt)" || true
            exit 1
          fi
          echo "Compile OK"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-cache-dir transformers peft trl datasets huggingface_hub accelerate
      - name: Run v5 training
        run: python kin-gguf/train_v5.py 2>&1 | tee /tmp/train_output.txt; if [ ${PIPESTATUS[0]} -ne 0 ]; then gh pr comment 36 --body "$(tail -100 /tmp/train_output.txt)" || true; exit 1; fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || '' }}
          GH_TOKEN: ${{ github.token }}
