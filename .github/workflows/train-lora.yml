name: train-lora
on:
  pull_request_target:
    branches: [main]
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: contains(github.event.pull_request.head.ref, 'train')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install ML deps
        run: pip install --no-cache-dir transformers peft trl datasets huggingface_hub accelerate
      - name: Generate + upload v5 dataset
        continue-on-error: true
        timeout-minutes: 9
        run: python kin-gguf/train_v5.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || '' }}
      - name: Train LoRA adapter (GPU-adaptive)
        run: python kin-gguf/train_lora.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || '' }}
